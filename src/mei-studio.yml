musikisum/educandu-plugin-mei-studio:
  name:
    en: MEI Studio
    de: MEI-Studio
  zoom:
    en: Zoom
    de: Zoom
  spacingSystem:
    en: System spacing
    de: Akkoladenabstand
  measuresPerLine:
    en: Measures per line
    de: Takte pro Zeile
  measuresPerLineInfo:
    en: At 0 (automatic), Verovio breaks lines by available width, as before. At a value above 0, exactly that many measures are forced onto each line, overriding any line breaks encoded in the file.
    de: Bei 0 (automatisch) bricht Verovio Zeilen wie bisher nach verfügbarer Breite um. Bei einem Wert über 0 wird auf jeder Zeile genau diese Anzahl Takte erzwungen, im MEI-Dokument codierte Zeilenumbrüche werden dabei überschrieben.
  automatic:
    en: Automatic
    de: Automatisch
  renderError:
    en: The file could not be displayed. Please check whether it is a valid MEI file.
    de: Die Datei konnte nicht angezeigt werden. Bitte prüfen Sie, ob es sich um eine gültige MEI-Datei handelt.
  largeFileWarning:
    en: This is a large file. Loading and displaying it may take a while.
    de: Dies ist eine große Datei. Laden und Anzeigen können eine Weile dauern.
  playbackEnabled:
    en: Ear training
    de: Gehörbildung
  playbackEnabledInfo:
    en: Adds an optional audio playback with a piano sound, generated from the notation, plus the ability to set the volume of each voice individually - useful for ear-training exercises with multi-voice pieces. Playback is only loaded once the play button is clicked.
    de: Fügt eine optionale, aus der Notation erzeugte Audio-Wiedergabe mit Klaviersound hinzu, inklusive der Möglichkeit, die Lautstärke jeder Stimme einzeln einzustellen - nützlich für Gehörbildungsübungen bei mehrstimmigen Stücken. Die Wiedergabe wird erst beim Klick auf den Abspielbutton geladen.
  tempo:
    en: Tempo
    de: Tempo
  tempoInfo:
    en: Scales the playback speed. This is applied when the audio is generated, not as a playback-rate effect on the finished recording, so pitch stays natural at every speed.
    de: Skaliert das Wiedergabetempo. Das wirkt schon bei der Erzeugung der Audiodatei, nicht als nachträglicher Geschwindigkeitseffekt auf die fertige Aufnahme, daher bleibt die Tonhöhe bei jedem Tempo natürlich.
  removeSilence:
    en: Remove silence
    de: Stille entfernen
  removeSilenceInfo:
    en: Shortens unusually long silent gaps in the playback (e.g. a written-out repeat with no notes for the second pass) down to a normal pause. Turn this off if a piece has an intentionally long pause that should be kept.
    de: Kürzt ungewöhnlich lange stille Abschnitte in der Wiedergabe (z. B. bei einer ausgeschriebenen Wiederholung ohne Noten für den zweiten Durchgang) auf eine normale Pause. Ausschalten, wenn ein Stück eine bewusst lange Pause hat, die erhalten bleiben soll.
  voiceVolumes:
    en: Voice volume
    de: Stimmlautstärke
  voiceVolumesInfo:
    en: Sets the volume of each voice for playback. Notes of louder voices are also shown in a stronger highlight color in the notation.
    de: Legt die Lautstärke jeder Stimme für die Wiedergabe fest. Noten lauterer Stimmen werden zudem stärker in der Hervorhebungsfarbe eingefärbt.
  voiceFallbackLabel:
    en: Voice {voiceNumber}
    de: Stimme {voiceNumber}
  playbackTooLargeWarning:
    en: This piece has too many notes for audio playback to render in a reasonable time. Playback is disabled for this file; the display and voice highlighting are not affected.
    de: Dieses Stück hat zu viele Noten, um die Audio-Wiedergabe in angemessener Zeit zu erzeugen. Die Wiedergabe ist für diese Datei deaktiviert, die Anzeige und die farbliche Stimmenhervorhebung sind davon nicht betroffen.
  highlightColor:
    en: Color
    de: Farbe
  resizeHint:
    en: The browser window was resized. Please reload the page so the notation adjusts to the new size correctly.
    de: Das Browserfenster wurde in der Größe geändert. Bitte die Seite neu laden, damit sich die Notenansicht korrekt anpasst.
